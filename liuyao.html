<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>六爻纳甲 · 墨黑朱砂</title>
<link rel="stylesheet" href="css/common.css">
<style>
  :root{
    --bg:#15110c; --paper:#1c1812; --vermilion:#b8341e;
    --bronze:#8a6c3a; --jade:#5a8a6a; --gold:#c69838;
    --accent:#b8341e; --gold-bright:#e8c08a; --ink:#e8dcc0; --panel:#1c1812;
  }
  .err{color:#f0a890;background:rgba(184,52,30,.12);border:1px solid rgba(184,52,30,.4);
    border-radius:8px;padding:12px;font-size:14px;margin-top:14px;display:none}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>.col{flex:1;min-width:130px}
  /* 卦象 */
  .gua-wrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .gua{flex:1;min-width:240px;background:var(--paper);border:1px solid color-mix(in srgb,var(--gold) 22%,transparent);
    border-radius:14px;padding:16px 14px}
  .gua .gname{text-align:center;font-size:17px;color:var(--gold-bright);font-weight:700;letter-spacing:2px;margin-bottom:12px}
  .yao{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid color-mix(in srgb,var(--gold) 12%,transparent)}
  .yao:last-child{border-bottom:none}
  .yao.moving{background:color-mix(in srgb,var(--vermilion) 14%,transparent);border-radius:6px}
  .draw{display:flex;flex-direction:column;gap:5px;width:120px;flex:0 0 auto}
  .bar{height:9px;border-radius:2px;background:var(--ink)}
  .bar.yin{background:transparent;position:relative}
  .bar.yin::before,.bar.yin::after{content:"";position:absolute;top:0;height:9px;background:var(--ink);border-radius:2px}
  .bar.yin::before{left:0;width:52px}.bar.yin::after{right:0;width:52px}
  .yao.moving .bar{background:var(--vermilion)}
  .yao.moving .bar.yin::before,.yao.moving .bar.yin::after{background:var(--vermilion)}
  .yao.isbian{background:color-mix(in srgb,var(--jade) 12%,transparent);border-radius:6px}
  .info{flex:1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .gz{font-size:15px;color:var(--gold-bright);font-weight:600;letter-spacing:1px}
  .qin{font-size:12px;color:var(--jade);border:1px solid color-mix(in srgb,var(--jade) 45%,transparent);padding:1px 8px;border-radius:12px}
  .god{font-size:12px;color:var(--gold);opacity:.9}
  .mark{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px}
  .mark.shi{background:var(--vermilion);color:#fff}
  .mark.ying{background:var(--bronze);color:#1a1206}
  .mark.dong{background:var(--gold);color:#1a1206}
  .mark.bian{background:var(--jade);color:#0e0b06}
  .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;justify-content:center}
  .meta .m{font-size:12px;color:var(--gold);opacity:.85;letter-spacing:1px}
  .note{font-size:12px;opacity:.62;margin-top:8px;line-height:1.55}
  .coins{display:flex;gap:14px;justify-content:center;margin-top:14px;height:54px;opacity:0;pointer-events:none;transition:opacity .25s}
  .coins.on{opacity:1}
  .coin{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8c08a,#c69838 60%,#8a6c3a);
    color:#1a1206;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.16);font-family:"STKaiti","KaiTi",serif}
  .coin.spin{animation:coinflip .5s ease-in-out infinite}
  @keyframes coinflip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(180deg) translateY(-12px)}100%{transform:rotateY(360deg) translateY(0)}}
  .btn:disabled{opacity:.5;cursor:wait}
  /* 卦辞爻辞 */
  .jing{background:linear-gradient(180deg,#211a11,#1a140d);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);
    border-radius:14px;padding:16px 18px;margin-top:14px}
  .jing h3{font-size:15px;color:var(--gold-bright);font-weight:700;letter-spacing:1px;margin-bottom:10px}
  .jing .jrow{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed color-mix(in srgb,var(--gold) 18%,transparent)}
  .jing .jrow:last-child{border-bottom:none}
  .jing .jtag{flex:0 0 auto;font-size:13px;color:var(--vermilion);font-weight:700;min-width:108px}
  .jing .jtag.t{color:var(--gold-bright)}
  .jing .jtxt{flex:1;font-size:13.5px;color:var(--ink);line-height:1.7;font-family:"STKaiti","KaiTi",serif}
  .jing .jqin{color:var(--jade)}
  .jing .note{font-size:12px;opacity:.6;margin-top:10px;line-height:1.6}
  /* 迷你卦（互卦绘制） */
  .gua-mini{flex:0 0 auto;background:var(--paper);border:1px solid color-mix(in srgb,var(--gold) 22%,transparent);border-radius:12px;padding:12px 10px;text-align:center}
  .gua-mini .gm-name{font-size:13px;color:var(--gold-bright);font-weight:700;letter-spacing:1px;margin-bottom:8px}
  .gua-mini .gm-yao{display:flex;flex-direction:column;gap:4px;align-items:center}
  .gua-mini .gm-bar{height:7px;width:84px;background:var(--ink);border-radius:2px}
  .gua-mini .gm-bar.yin{background:transparent;position:relative}
  .gua-mini .gm-bar.yin::before,.gua-mini .gm-bar.yin::after{content:"";position:absolute;top:0;height:7px;background:var(--ink);border-radius:2px}
  .gua-mini .gm-bar.yin::before{left:0;width:36px}.gua-mini .gm-bar.yin::after{right:0;width:36px}
  /* 经文分段 / 综合参断 */
  .jing .jsec{padding:11px 0;border-bottom:1px dashed color-mix(in srgb,var(--gold) 18%,transparent)}
  .jing .jsec:last-child{border-bottom:none}
  .jing .jtxt{margin:3px 0;font-size:13.5px;color:var(--ink);line-height:1.7;font-family:"STKaiti","KaiTi",serif}
  .jing .jtuan{opacity:.92}
  .jing .jdaxiang{opacity:.82}
  .syn .srow{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed color-mix(in srgb,var(--gold) 18%,transparent)}
  .syn .srow:last-child{border-bottom:none}
  .syn .stag{flex:0 0 auto;font-size:13px;color:var(--vermilion);font-weight:700;min-width:84px}
  .syn .stxt{flex:1;font-size:13.5px;color:var(--ink);line-height:1.7;font-family:"STKaiti","KaiTi",serif}
  @media(max-width:680px){ .gua{min-width:100%}.draw{width:96px}.bar.yin::before,.bar.yin::after{width:40px}.jing .jtag{min-width:84px}.gua-mini .gm-bar{width:70px}.gua-mini .gm-bar.yin::before,.gua-mini .gm-bar.yin::after{width:30px} }
</style>
</head>

<div class="wrap">
  <div class="page-head">
    <h1>六爻纳甲</h1>
    <div class="en">LIU YAO NA JIA · Coin Oracle · 墨黑朱砂</div>
    <div class="sub">三枚铜钱摇卦 · 京房纳甲定世应 · 排六亲六兽 · 动爻朱砂为记</div>
  </div>

  <div class="card">
    <h3>起卦</h3>
    <div class="row">
      <div class="col">
        <label>占事日干（定六兽）</label>
        <select id="lg-daygan">
          <option value="0">甲日</option><option value="1">乙日</option>
          <option value="2">丙日</option><option value="3">丁日</option>
          <option value="4">戊日</option><option value="5">己日</option>
          <option value="6">庚日</option><option value="7">辛日</option>
          <option value="8">壬日</option><option value="9">癸日</option>
        </select>
      </div>
      <div class="col">
        <label>或留空（取当前日干推算）</label>
        <input id="lg-note" type="text" value="" disabled placeholder="自动取日干">
      </div>
    </div>
    <button class="btn" id="btn-shake">🜆 摇 卦</button>
    <div class="coins" id="coins" aria-hidden="true"><div class="coin">爻</div><div class="coin">爻</div><div class="coin">爻</div></div>

  </div>

  <div id="liuyao-result"></div>
</div>

  <div class="disclaimer">⚠️ 以上为玄学体系的传统解读与象征推演，仅供参考。本页由 AI 生成，不构成医疗、法律、财务或投资建议；命理是参考，不是定数。涉及健康、法律、重大财务决策请咨询相应专业人士。</div>

<script src="js-engine/src/yijing-text.js"></script>
<script src="js-engine/src/liuyao.js"></script>
<script>
(function(){
  "use strict";
  function $(s){return document.querySelector(s);}
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  // 每爻一行：阳=整条；阴=两断条（用 yin 类断开）
  function yaoRow(line, moving){
    var row=el("div","yao"+(moving?" moving":"")+(line.isBian?" isbian":""));
    var d=el("div","draw");
    var b=el("div","bar"+(line.yin?" yin":"")); d.appendChild(b);
    row.appendChild(d);
    var info=el("div","info");
    info.appendChild(el("span","gz",line.gz));
    info.appendChild(el("span","qin",line.qin));
    info.appendChild(el("span","god",line.god));
    if(line.isShi)info.appendChild(el("span","mark shi","世"));
    if(line.isYing)info.appendChild(el("span","mark ying","应"));
    if(line.moving)info.appendChild(el("span","mark dong","动"));
    if(line.isBian)info.appendChild(el("span","mark bian","变"));
    row.appendChild(info);
    return row;
  }
  function renderGua(title, hex, lines, bianName){
    var g=el("div","gua");
    g.appendChild(el("div","gname",title+"　"+hex.name));
    for(var i=5;i>=0;i--){ // 上→初
      var ln=lines[i];
      g.appendChild(yaoRow(ln, ln.moving));
    }
    return g;
  }
  // 八纯卦线型（自底向上：1=阳 0=阴）— 用于迷你卦/互卦绘制
  var TRIGRAM_LINES = { 1:[1,1,1], 2:[1,1,0], 3:[1,0,1], 4:[1,0,0], 5:[0,1,1], 6:[0,1,0], 7:[0,0,1], 8:[0,0,0] };
  function hexLines(idx){ var up=((idx/8)|0)+1, down=(idx%8)+1; return TRIGRAM_LINES[down].concat(TRIGRAM_LINES[up]); }
  function miniGua(title, idx){
    var g=el("div","gua-mini");
    g.appendChild(el("div","gm-name", title+"　"+LIuyao.HEX_NAME[idx]));
    var wrap=el("div","gm-yao"); var lines=hexLines(idx);
    for(var i=5;i>=0;i--){ wrap.appendChild(el("div","gm-bar"+(lines[i]?"":" yin"))); }
    g.appendChild(wrap); return g;
  }
  function jsec(title, guaci, tuan, daxiang){
    var sec=el("div","jsec");
    sec.appendChild(el("div","jtag t", title));
    var bd=el("div");
    bd.appendChild(el("div","jtxt","卦辞：「"+guaci+"」"));
    bd.appendChild(el("div","jtxt jtuan","彖传：「"+tuan+"」"));
    bd.appendChild(el("div","jtxt jdaxiang","大象：「"+daxiang+"」"));
    sec.appendChild(bd); return sec;
  }
  function srow(tag, txt){ var r=el("div","srow"); r.appendChild(el("div","stag",tag)); r.appendChild(el("div","stxt",txt)); return r; }
  var KE={"木":"土","土":"水","水":"火","火":"金","金":"木"}, PRODUCE={"木":"火","火":"土","土":"金","金":"水","水":"木"};
  function relTo(shi, l){
    var sE=shi.zhiElem, lE=l.zhiElem;
    if(lE===sE) return "比和（同我），事多平顺、彼此助力。";
    if(PRODUCE[lE]===sE) return "动爻生世（生我），得人助、事有进益。";
    if(PRODUCE[sE]===lE) return "世生动爻（我生），我方付出、耗神费力。";
    if(KE[lE]===sE) return "动爻克世（克我），有阻有耗、宜慎防。";
    if(KE[sE]===lE) return "世克动爻（我克），我制其事、可掌其权。";
    return "关系寻常。";
  }
  function totalLine(r){
    if(!r.hasMoving) return "静卦，事态少变，依本卦之体与世应、六亲旺衰观其大势。";
    var n=r.lines.filter(function(l){return l.moving;}).length;
    if(n===1) return "独发，事机专一，以该动爻之辞与六亲、生克为主断。";
    if(n===2) return "二爻发动，事有两途或表里，宜合观二动爻之生克向背。";
    return "多动（"+n+" 爻），事绪纷繁、变机交错，当以世应为枢、察动爻之向背而定。";
  }
  function synthCard(r, yaos){
    var shi=r.lines[r.shi], ying=r.lines[r.ying];
    var card=el("div","card jing syn");
    card.appendChild(el("h3",null,"综合参断 · 体用 · 世应 · 动爻"));
    var rows=el("div");
    var su="本卦（"+r.ben.name+"）为体，主我、内因；"+(r.hasMoving?("变卦（"+r.bian.name+"）为用，主事、外缘。"):"静卦无变，体用未分，事态平稳。");
    rows.appendChild(srow("体用", su));
    rows.appendChild(srow("世应", "世爻（"+shi.gz+"·"+shi.qin+"）为我方；应爻（"+ying.gz+"·"+ying.qin+"）为对方/环境，分居第 "+(r.shi+1)+" / "+(r.ying+1)+" 爻。"));
    var hu=LIuyao.hugua(yaos);
    rows.appendChild(srow("互卦", "「"+hu.name+"」——本卦内藏之象，主事之中段情态、隐伏之机，与体用合参。"));
    if(r.hasMoving){
      r.lines.forEach(function(l){
        if(l.moving){
          var posName=["初","二","三","四","五","上"][l.pos];
          var yaoTi=(l.type===7||l.type===9)?"九":"六";
          rows.appendChild(srow("动爻 "+yaoTi+posName, "（"+l.qin+"·"+l.zhi+"·"+l.zhiElem+"）"+relTo(shi,l)));
        }
      });
    } else {
      rows.appendChild(srow("动爻", "无动爻（静卦），以世应、六亲旺衰观其大势。"));
    }
    card.appendChild(rows);
    card.appendChild(el("div","note","总断：「"+totalLine(r)+"」"));
    card.appendChild(el("div","note","用神之取随所占之事而异：财依妻财、官依官鬼、文书依父母、小口依子孙、同辈依兄弟。此以世爻为“我”、应爻为“彼”、动爻为变机，供合参；具体问事须另行定用神，方定吉凶。"));
    return card;
  }

  function render(r, yaos){
    var box=$("#liuyao-result"); box.innerHTML="";
    var Y=(typeof window!=="undefined"&&window.YIJING)?window.YIJING:(typeof YIJING!=="undefined"?YIJING:null);
    // 卦象
    var cg=el("div","card"); cg.appendChild(el("h3",null,"卦象 · 本宫 "+r.palace+"（"+r.palaceElem+"）"));
    var wrap=el("div","gua-wrap");
    wrap.appendChild(renderGua("本卦", r.ben, r.lines));
    if(r.hasMoving){
      var bl=r.lines.map(function(l){ return {gz:l.gz,zhi:l.zhi,zhiElem:l.zhiElem,yin:l.moving?!l.yin:l.yin,type:l.type,moving:false,isBian:l.moving,qin:l.qin,god:l.god,isShi:l.isShi,isYing:l.isYing}; });
      wrap.appendChild(renderGua("变卦", r.bian, bl));
    }
    cg.appendChild(wrap);
    cg.appendChild(el("div","meta",
      "<span class='m'>世爻在第 "+(r.shi+1)+" 爻</span>"+
      "<span class='m'>应爻在第 "+(r.ying+1)+" 爻</span>"+
      "<span class='m'>日干 "+r.dayGan+"</span>"));
    cg.appendChild(el("div","note","纳甲依本宫（"+r.palace+"）安六爻干支；六亲依宫五行与本爻地支五行生克（我、生我、我克、克我、同我）；六兽依日干起例。动爻以朱砂色标记，为事之变机。"));
    box.appendChild(cg);

    // 互卦
    var hu=LIuyao.hugua(yaos);
    var ch=el("div","card");
    ch.appendChild(el("h3",null,"互卦 · 体中之体"));
    var hwrap=el("div","row");
    hwrap.appendChild(miniGua("互卦", hu.idx));
    var hinfo=el("div","col");
    hinfo.appendChild(el("div","note","互卦取法：下互取本卦二、三、四爻，上互取三、四、五爻，是卦中内藏之象。"));
    hinfo.appendChild(el("div","note","互卦为「"+hu.name+"」。观互卦可参本卦未尽之意，与变卦合看，体·用·互·变四象乃六爻取象之要。"));
    hwrap.appendChild(hinfo);
    ch.appendChild(hwrap);
    box.appendChild(ch);

    // 经文 + 综合
    if(Y){
      var jc=el("div","card jing");
      jc.appendChild(el("h3",null,"周易经文 · 卦辞 · 彖传 · 大象传"));
      jc.appendChild(jsec("本卦 · "+r.ben.name, Y.GUACI[r.ben.idx], Y.TUAN[r.ben.idx], Y.DAXIANG[r.ben.idx]));
      if(r.hasMoving){
        r.lines.forEach(function(l){
          if(l.moving){
            var posName=["初","二","三","四","五","上"][l.pos];
            var yaoTi=(l.type===7||l.type===9)?"九":"六";
            var sec=el("div","jsec");
            sec.appendChild(el("div","jtag jqin","动爻 · "+yaoTi+posName+"（"+l.qin+"）"));
            var bd=el("div");
            bd.appendChild(el("div","jtxt","本卦：「"+Y.YAOCI[r.ben.idx][l.pos]+"」"));
            bd.appendChild(el("div","jtxt","之卦：「"+Y.YAOCI[r.bian.idx][l.pos]+"」"));
            sec.appendChild(bd);
            jc.appendChild(sec);
          }
        });
        jc.appendChild(jsec("变卦 · "+r.bian.name, Y.GUACI[r.bian.idx], Y.TUAN[r.bian.idx], Y.DAXIANG[r.bian.idx]));
      }
      jc.appendChild(el("div","note","一爻动，以本卦动爻爻辞为主、之卦（变卦）对应爻参看；多爻动则合观本、变二卦之辞。经文为《周易》通行本原文，断语须合纳甲、世应、六亲、五行生克综合参看，仅作传统象数参考。"));
      box.appendChild(jc);
      box.appendChild(synthCard(r, yaos));
    }

    if(!r.hasMoving){
      box.appendChild(el("div","note","本次摇卦无动爻（静卦），仅断本卦之体，事态相对平稳、变化少；仍可参互卦与卦辞大象以观其势。"));
    }
    box.scrollIntoView({behavior:"smooth",block:"start"});
  }

  $("#btn-shake").addEventListener("click",function(){
    var err=$("#err-liuyao"); err.style.display="none"; err.textContent="";
    var coins=$("#coins"), btn=$("#btn-shake");
    coins.classList.add("on");
    [].forEach.call(coins.children,function(c){ c.classList.add("spin"); });
    btn.disabled=true;
    setTimeout(function(){
      try{
        var yaos=LIuyao.shake();
        var dg=+$("#lg-daygan").value;
        var r=LIuyao.analyze(yaos, dg);
        render(r, yaos);
      }catch(e){ err.style.display="block"; err.textContent="⚠ "+e.message; }
      coins.classList.remove("on");
      [].forEach.call(coins.children,function(c){ c.classList.remove("spin"); });
      btn.disabled=false;
    }, 900);
  });
})();
</script>
</body>
