<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="css/common.css">
<style>
  :root{
    --bg:#0a0e2a; --purple:#a890ff; --silver-bright:#e8e4ff;
    --gold:#ffd66e; --cyan:#6ee0d6; --rose:#ff8eb8; --green:#7ee090;
    --accent:#a890ff; --gold-bright:#ffd66e; --ink:#e8e4ff;
    --panel:rgba(40,40,90,.32);
  }
  #stars{position:fixed;inset:0;z-index:0;opacity:.7;pointer-events:none}
  .wrap{position:relative;z-index:1}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>.col{flex:1;min-width:120px}
  .err{color:var(--rose);background:rgba(255,142,184,.1);border:1px solid rgba(255,142,184,.4);
    border-radius:8px;padding:12px;font-size:14px;margin-top:14px;display:none}
  /* 十二宫盘 */
  .zwheel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .zg{background:var(--panel);border:1px solid color-mix(in srgb,var(--purple) 28%,transparent);
    border-radius:12px;padding:11px 10px;min-height:104px;position:relative;z-index:3;transition:.18s}
  .zg:hover{border-color:var(--purple);box-shadow:0 0 16px rgba(168,144,255,.22)}
  .zg.ming{background:linear-gradient(180deg,rgba(255,214,110,.14),var(--panel));border-color:var(--gold)}
  .zg.body{border-color:color-mix(in srgb,var(--cyan) 60%,transparent)}
  .zg .gname{font-size:15px;color:var(--silver-bright);font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .zg .gz{font-size:12px;color:var(--gold);opacity:.85;margin:3px 0 7px}
  .zg .stars{display:flex;flex-direction:column;gap:2px}
  .zg .st{font-size:13px;color:var(--silver-bright);line-height:1.35}
  .zg .st.minor{font-size:11.5px;color:#b8b0e0;opacity:.72}
  .badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;letter-spacing:1px;
    border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);color:var(--gold);margin-left:2px}
  .badge.body{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 55%,transparent)}
  .zg.sanfang{box-shadow:0 0 0 1px color-mix(in srgb,var(--cyan) 45%,transparent),0 0 16px rgba(110,224,214,.18)}
  .badge.sf{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 55%,transparent)}
  .mut{font-size:10px;margin-left:4px;padding:0 5px;border-radius:6px;font-weight:700}
  .mut.禄{color:#0a0e2a;background:var(--gold)}
  .mut.权{color:#0a0e2a;background:var(--rose)}
  .mut.科{color:#0a0e2a;background:var(--cyan)}
  .mut.忌{color:#0a0e2a;background:#9a93b0}
  /* 三方四正连线 */
  .zwheel-wrap{position:relative}
  .sf-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .sf-lines line{stroke:var(--cyan);stroke-width:1.5;opacity:.55;stroke-linecap:round;
    filter:drop-shadow(0 0 4px rgba(110,224,214,.6))}
  .zwheel-cap{font-size:11.5px;color:var(--cyan);opacity:.8;margin-top:10px;letter-spacing:.5px}
  /* 四化 */
  .sx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sx{background:var(--panel);border:1px solid color-mix(in srgb,var(--purple) 26%,transparent);border-radius:12px;padding:14px 12px;text-align:center}
  .sx .t{font-size:15px;font-weight:700;width:34px;height:34px;line-height:34px;border-radius:50%;margin:0 auto 8px;color:#0a0e2a}
  .sx.禄 .t{background:var(--gold)} .sx.权 .t{background:var(--rose)} .sx.科 .t{background:var(--cyan)} .sx.忌 .t{background:#9a93b0}
  .sx .star{font-size:16px;color:var(--silver-bright);font-weight:600}
  .sx .to{font-size:12px;color:var(--gold);opacity:.85;margin-top:3px}
  /* 流年 */
  .zg.ln{box-shadow:0 0 0 1px color-mix(in srgb,var(--rose) 45%,transparent),0 0 14px rgba(255,142,184,.18)}
  .zg.lnming{background:linear-gradient(180deg,rgba(255,142,184,.16),var(--panel));border-color:var(--rose)}
  .badge.ln{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 55%,transparent)}
  .badge.lnming{color:#0a0e2a;background:var(--rose);border:none}
  .ln-card .gp{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .ln-card .gp .g{flex:0 0 auto;background:var(--panel);border:1px solid color-mix(in srgb,var(--rose) 30%,transparent);border-radius:9px;padding:8px 12px;min-width:88px;text-align:center}
  .ln-card .gp .g .nm{font-size:13px;color:var(--silver-bright);font-weight:600}
  .ln-card .gp .g .st{font-size:11px;color:var(--gold);opacity:.85;margin-top:2px}
  /* 大限 */
  .dx-seq{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
  .dx{flex:0 0 auto;text-align:center;background:var(--panel);border:1px solid color-mix(in srgb,var(--purple) 26%,transparent);
    border-radius:9px;padding:9px 11px;min-width:80px}
  .dx.cur{border-color:var(--gold);box-shadow:0 0 14px rgba(255,214,110,.25)}
  .dx .gz{font-size:18px;color:var(--gold-bright);font-weight:600}
  .dx .age{font-size:11px;color:var(--silver-bright);opacity:.78;margin-top:3px}
  .dx .pn{font-size:10px;color:var(--purple);opacity:.8}
  .note{font-size:12px;opacity:.62;margin-top:8px;line-height:1.55}
  @media(max-width:680px){
    .zwheel{grid-template-columns:repeat(2,1fr)}
    .sx-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>

<script src="js-engine/vendor/node_modules/iztro/dist/iztro.min.js"></script>
<script>
(function(){
  "use strict";
  function $(s){return document.querySelector(s);}
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
  var BR_ORDER=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
  // 天干地支（算流年干支用）
  var GAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
  var ZHI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
  // 紫微四化表：天干 -> [禄星,权星,科星,忌星]（中州派通用）
  var GAN4={
    "甲":["廉贞","破军","武曲","太阳"], "乙":["天机","天梁","紫微","太阴"],
    "丙":["天同","天机","文昌","廉贞"], "丁":["太阴","天同","天机","巨门"],
    "戊":["贪狼","太阴","右弼","天机"], "己":["武曲","贪狼","天梁","文曲"],
    "庚":["太阳","武曲","太阴","天同"], "辛":["巨门","太阳","文曲","文昌"],
    "壬":["天梁","紫微","左辅","武曲"], "癸":["破军","巨门","太阴","贪狼"]
  };
  // 五虎遁：流年天干 -> 正月(寅月)天干（甲己→丙、乙庚→戊、丙辛→庚、丁壬→壬、戊癸→甲）
  var TIGER={"甲":"丙","己":"丙","乙":"戊","庚":"戊","丙":"庚","辛":"庚","丁":"壬","壬":"壬","戊":"甲","癸":"甲"};

  // 星点背景
  (function(){
    var c=document.getElementById('stars'),x=c.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),W,H,ps=[];
    function sz(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);ps=[];var n=Math.min(140,Math.floor(W*H/9000));for(var i=0;i<n;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,a:Math.random()*.6+.25});}
    function dr(){x.clearRect(0,0,W,H);for(var i=0;i<ps.length;i++){var p=ps[i];x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle='rgba(168,144,255,'+p.a+')';x.fill();}}
    sz();dr();var t;addEventListener('resize',function(){clearTimeout(t);t=setTimeout(function(){sz();dr();},180);});
  })();

  // 三方四正 SVG 连线
  function buildSanFangSvg(){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','sf-lines');return s;}
  function drawSanFang(){
    var wrap=document.querySelector('.zwheel-wrap'); if(!wrap) return;
    var svg=wrap.querySelector('.sf-lines'); if(!svg) return;
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var nodes=wrap.querySelectorAll('.zg.sanfang'); if(nodes.length<2) return;
    var wr=wrap.getBoundingClientRect();
    svg.setAttribute('viewBox','0 0 '+wr.width+' '+wr.height);
    svg.setAttribute('width',wr.width); svg.setAttribute('height',wr.height);
    function ctr(n){var r=n.getBoundingClientRect();return {x:r.left-wr.left+r.width/2,y:r.top-wr.top+r.height/2};}
    var C={}; nodes.forEach(function(n){C[n.dataset.name]=ctr(n);});
    function ln(a,b){if(!a||!b)return;var l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',a.x.toFixed(1));l.setAttribute('y1',a.y.toFixed(1));
      l.setAttribute('x2',b.x.toFixed(1));l.setAttribute('y2',b.y.toFixed(1));svg.appendChild(l);}
    if(C['命宫']&&C['财帛']) ln(C['命宫'],C['财帛']);
    if(C['财帛']&&C['官禄']) ln(C['财帛'],C['官禄']);
    if(C['财帛']&&C['迁移']) ln(C['财帛'],C['迁移']);
  }
  var _sfT; addEventListener('resize',function(){clearTimeout(_sfT);_sfT=setTimeout(drawSanFang,160);});

  // 流月默认当前公历月份（农历月近似，用户可微调）；变更即重排
  try{ $("#zlm").value=Math.min(12,new Date().getMonth()+1); }catch(e){}
  $("#zlm").addEventListener("change",function(){ if($("#ziwei-result").children.length) $("#btn-ziwei").click(); });

  $("#btn-ziwei").addEventListener("click",function(){
    var err=$("#err-ziwei");err.style.display="none";err.textContent="";
    try{
      var y=+$("#zy").value,m=+$("#zm").value,d=+$("#zd").value,hh=+$("#zh").value;
      if(!y||!m||!d) throw new Error("请填写完整的出生年月日");
      var solar=y+"-"+(m<10?"0":"")+m+"-"+(d<10?"0":"")+d;
      var a=iztro.astro.bySolar(solar, hh, $("#zgender").value, 'zh-CN');
      var age=$("#zage").value!==""?(+$("#zage").value):null;
      var lnYear=$("#zln").value!==""?(+$("#zln").value):2026;
      renderZiwei(a,age,lnYear);
    }catch(e){ err.style.display="block"; err.textContent="⚠ "+e.message; }
  });

  function renderZiwei(a,age,lnYear){
    var box=$("#ziwei-result"); box.innerHTML="";

    // 命宫 / 身宫
    var ming=null,body=null;
    a.palaces.forEach(function(p){ if(p.isOriginalPalace)ming=p; if(p.isBodyPalace)body=p; });
    var mz=ming?ming.heavenlyStem+ming.earthlyBranch:"";
    var mstars=ming?(ming.majorStars||[]).map(function(s){return s.name;}).join("、"):"";

    // 四化：扫所有主星 mutagen
    var acts={禄:[],权:[],科:[],忌:[]};
    a.palaces.forEach(function(p){
      (p.majorStars||[]).forEach(function(s){
        if(s.mutagen&&acts[s.mutagen]) acts[s.mutagen].push(s.name+"→"+p.name);
      });
    });

    // 1) 十二宫盘（斗数正统序：命宫→兄弟→…→父母）
    var cg=el("div","card"); cg.appendChild(el("h3",null,"十二宫盘 "+(ming?("命宫 "+ming.name+" "+mz+"　主星："+mstars):"")));
    var gridWrap=el("div","zwheel-wrap");
    var grid=el("div","zwheel");
    var ZW_ORDER=['命宫','兄弟','夫妻','子女','财帛','疾厄','迁移','仆役','官禄','田宅','福德','父母'];
    var SF=['命宫','财帛','官禄','迁移']; // 命宫三方四正
    var sorted=a.palaces.slice().sort(function(x,y){return ZW_ORDER.indexOf(x.name)-ZW_ORDER.indexOf(y.name);});

    // 流年（依斗数正统规则自算，不依赖 iztro 不稳定流年 API）
    var gIdx=(lnYear-4)%10, zIdx=(lnYear-4)%12;
    if(gIdx<0)gIdx+=10; if(zIdx<0)zIdx+=12;
    var lnGan=GAN[gIdx], lnZhi=ZHI[zIdx];
    var lnMing=sorted.filter(function(p){return p.earthlyBranch===lnZhi;})[0]||null;
    var lnSF=new Set();
    if(lnMing){
      var ci=ZW_ORDER.indexOf(lnMing.name);
      [4,6,8].forEach(function(o){ lnSF.add(sorted[(ci+o)%12].name); }); // 财帛+4 迁移+6 官禄+8
    }
    var lnActs={禄:[],权:[],科:[],忌:[]};
    if(GAN4[lnGan]){
      var sf4=GAN4[lnGan];
      ["禄","权","科","忌"].forEach(function(t,i){
        var star=sf4[i];
        a.palaces.forEach(function(p){
          (p.majorStars||[]).forEach(function(s){ if(s.name===star) lnActs[t].push(star+"→"+p.name); });
        });
      });
    }
    sorted.forEach(function(p){
      var sf=SF.indexOf(p.name)>=0;
      var isLnMing=lnMing&&p===lnMing, isLnSF=lnSF.has(p.name);
      var zcls="zg"+(p.isOriginalPalace?" ming":"")+(p.isBodyPalace?" body":"")+(sf?" sanfang":"");
      if(isLnMing)zcls+=" ln lnming"; else if(isLnSF)zcls+=" ln";
      var zg=el("div",zcls);
      zg.dataset.name=p.name;
      var nm=el("div","gname",p.name);
      if(p.isOriginalPalace)nm.appendChild(el("span","badge","命"));
      if(p.isBodyPalace)nm.appendChild(el("span","badge body","身"));
      if(sf)nm.appendChild(el("span","badge sf","三方"));
      if(isLnMing)nm.appendChild(el("span","badge lnming","流年命"));
      else if(isLnSF)nm.appendChild(el("span","badge ln","流年"));
      zg.appendChild(nm);
      zg.appendChild(el("div","gz",p.heavenlyStem+p.earthlyBranch));
      var st=el("div","stars");
      (p.majorStars||[]).forEach(function(s){
        var line=el("div","st",s.name);
        if(s.mutagen&&["禄","权","科","忌"].indexOf(s.mutagen)>=0)line.appendChild(el("span","mut "+s.mutagen,s.mutagen));
        st.appendChild(line);
      });
      (p.minorStars||[]).slice(0,6).forEach(function(s){ st.appendChild(el("div","st minor",(s.name||s))); });
      zg.appendChild(st);
      grid.appendChild(zg);
    });
    gridWrap.appendChild(grid);
    gridWrap.appendChild(buildSanFangSvg());
    cg.appendChild(gridWrap);
    cg.appendChild(el("div","zwheel-cap","◇ 三方四正连线：命宫 · 财帛 · 官禄 · 迁移 — 命主格局之核心四宫"));
    box.appendChild(cg);
    drawSanFang();

    // 2) 四化
    var cs=el("div","card"); cs.appendChild(el("h3",null,"四化 · 禄权科忌"));
    var sg=el("div","sx-grid");
    ["禄","权","科","忌"].forEach(function(t){
      var sx=el("div","sx "+t);
      sx.appendChild(el("div","t",t));
      var list=acts[t].length?acts[t].join("<br>"):"—";
      sx.appendChild(el("div","star",(acts[t][0]?acts[t][0].split("→")[0]:"—")));
      sx.appendChild(el("div","to",acts[t].length?(acts[t][0].split("→")[1]+"宫"):"—"));
      sg.appendChild(sx);
    });
    cs.appendChild(sg);
    cs.appendChild(el("div","note","四化依命宫天干推导：禄主进益、权主掌控、科主声名、忌主纠缠。上表列出落陷星曜与其所在宫位。"));
    box.appendChild(cs);

    // 3) 大限
    var cd=el("div","card"); cd.appendChild(el("h3",null,"大限流转"+(age!=null?" · 当前 "+age+" 岁":"")));
    var seq=el("div","dx-seq");
    a.palaces.slice().sort(function(x,y){return (x.ages&&x.ages[0]||0)-(y.ages&&y.ages[0]||0);}).forEach(function(p){
      var ages=p.ages||[];
      var cur=false,win="";
      for(var i=0;i<ages.length;i++){
        var s=ages[i]; if(age!=null&&s<=age&&age<s+10){cur=true;win=s+"–"+(s+9);break;}
        if(i===0)win=s+"–"+(s+9);
      }
      var dx=el("div","dx"+(cur?" cur":""));
      dx.appendChild(el("div","gz",p.heavenlyStem+p.earthlyBranch));
      dx.appendChild(el("div","age",win+(cur?" 岁":"")));
      dx.appendChild(el("div","pn",p.name+"宫"));
      seq.appendChild(dx);
    });
    cd.appendChild(seq);
    cd.appendChild(el("div","note","大限依命宫天干阴阳、男女顺逆排布，每限十年。高亮为当前年龄所处大限（依 iztro 大限岁序推算，供参考）。"));
    box.appendChild(cd);

    // 4) 流年
    var cl=el("div","card ln-card");
    cl.appendChild(el("h3",null,"流年 · "+lnYear+"（"+lnGan+lnZhi+"年）"+(lnMing?("　流年命宫："+lnMing.name+" "+lnMing.heavenlyStem+lnMing.earthlyBranch):"")));
    if(lnMing){
      var gp=el("div","gp");
      var lnSet=new Set(lnSF); lnSet.add(lnMing.name);
      lnSet.forEach(function(nm2){
        var pp=sorted.filter(function(x){return x.name===nm2;})[0];
        var g=el("div","g");
        g.appendChild(el("div","nm",(pp===lnMing?"流年命宫 · ":"流年 · ")+pp.name));
        var sts=(pp.majorStars||[]).map(function(s){return s.name;}).join("、")||"—";
        g.appendChild(el("div","st",sts));
        gp.appendChild(g);
      });
      cl.appendChild(gp);
    }
    var sg2=el("div","sx-grid");
    ["禄","权","科","忌"].forEach(function(t){
      var sx=el("div","sx "+t);
      sx.appendChild(el("div","t",t));
      var arr=lnActs[t];
      sx.appendChild(el("div","star",arr[0]?arr[0].split("→")[0]:"—"));
      sx.appendChild(el("div","to",arr[0]?arr[0].split("→")[1]+"宫":"—"));
      sg2.appendChild(sx);
    });
    cl.appendChild(sg2);
    cl.appendChild(el("div","note","流年命宫 = 当年太岁（"+lnGan+lnZhi+"）所落之宫；其三方四正（财帛·官禄·迁移）为当年重点宫位。流年四化依流年天干（"+lnGan+"干）推导，与本命四化叠加参看，吉凶以实际星曜庙旺落陷为断。"));
    box.appendChild(cl);

    // 5) 流月（年盘流月法：以流年命宫为基，正月顺数；流月天干走五虎遁）
    var lmMonth=+$("#zlm").value||1;
    var lmGan0=TIGER[lnGan]||"丙";
    var lmGan=GAN[(GAN.indexOf(lmGan0)+(lmMonth-1))%10];
    var lmZhi=ZHI[(ZHI.indexOf("寅")+(lmMonth-1))%12];
    var lmMing=null,lmSF=new Set();
    if(lnMing){
      var ci2=ZW_ORDER.indexOf(lnMing.name);
      lmMing=sorted[(ci2+(lmMonth-1))%12];
      var ci3=ZW_ORDER.indexOf(lmMing.name);
      [4,6,8].forEach(function(o){ lmSF.add(sorted[(ci3+o)%12].name); });
    }
    var lmActs={禄:[],权:[],科:[],忌:[]};
    if(GAN4[lmGan]){
      var sf4b=GAN4[lmGan];
      ["禄","权","科","忌"].forEach(function(t,i){
        var star=sf4b[i];
        a.palaces.forEach(function(p){
          (p.majorStars||[]).forEach(function(s){ if(s.name===star) lmActs[t].push(star+"→"+p.name); });
        });
      });
    }
    var cm=el("div","card ln-card");
    cm.appendChild(el("h3",null,"流月 · 农历"+lmMonth+"月（"+lmGan+lmZhi+"月）"+(lmMing?("　流月命宫："+lmMing.name+" "+lmMing.heavenlyStem+lmMing.earthlyBranch):"")));
    if(lmMing){
      var gpm=el("div","gp");
      var lmSet=new Set(lmSF); lmSet.add(lmMing.name);
      lmSet.forEach(function(nm3){
        var pp2=sorted.filter(function(x){return x.name===nm3;})[0];
        var g=el("div","g");
        g.appendChild(el("div","nm",(pp2===lmMing?"流月命宫 · ":"流月 · ")+pp2.name));
        var sts2=(pp2.majorStars||[]).map(function(s){return s.name;}).join("、")||"—";
        g.appendChild(el("div","st",sts2));
        gpm.appendChild(g);
      });
      cm.appendChild(gpm);
    }
    var sg3=el("div","sx-grid");
    ["禄","权","科","忌"].forEach(function(t){
      var sx=el("div","sx "+t);
      sx.appendChild(el("div","t",t));
      var arr=lmActs[t];
      sx.appendChild(el("div","star",arr[0]?arr[0].split("→")[0]:"—"));
      sx.appendChild(el("div","to",arr[0]?arr[0].split("→")[1]+"宫":"—"));
      sg3.appendChild(sx);
    });
    cm.appendChild(sg3);
    cm.appendChild(el("div","note","流月依『年盘流月』法：以流年命宫（太岁宫）为基准，正月起于该宫，顺时针数至所选农历月，得流月命宫及其三方四正。流月天干由流年天干起五虎遁（甲己→丙寅、乙庚→戊寅、丙辛→庚寅、丁壬→壬寅、戊癸→甲寅）推得，流月四化据此推导。此为传统规则的简化演绎，不同流派（如月盘起法、闰月处理）略有出入，吉凶仍以本命星曜庙旺落陷为准。"));
    box.appendChild(cm);

    box.scrollIntoView({behavior:"smooth",block:"start"});
  }
})();
