<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>紫微斗数 · 深蓝紫银河</title>
<link rel="stylesheet" href="css/common.css">
<style>
  :root{
    --bg:#0a0e2a; --purple:#a890ff; --silver-bright:#e8e4ff;
    --gold:#ffd66e; --cyan:#6ee0d6; --rose:#ff8eb8; --green:#7ee090;
    --accent:#a890ff; --gold-bright:#ffd66e; --ink:#e8e4ff;
    --panel:rgba(40,40,90,.32);
  }
  #stars{position:fixed;inset:0;z-index:0;opacity:.7;pointer-events:none}
  .wrap{position:relative;z-index:1}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>.col{flex:1;min-width:120px}
  .err{color:var(--rose);background:rgba(255,142,184,.1);border:1px solid rgba(255,142,184,.4);
    border-radius:8px;padding:12px;font-size:14px;margin-top:14px;display:none}
  /* 十二宫盘 */
  .zwheel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .zg{background:var(--panel);border:1px solid color-mix(in srgb,var(--purple) 28%,transparent);
    border-radius:12px;padding:11px 10px;min-height:104px;position:relative;transition:.18s}
  .zg:hover{border-color:var(--purple);box-shadow:0 0 16px rgba(168,144,255,.22)}
  .zg.ming{background:linear-gradient(180deg,rgba(255,214,110,.14),var(--panel));border-color:var(--gold)}
  .zg.body{border-color:color-mix(in srgb,var(--cyan) 60%,transparent)}
  .zg .gname{font-size:15px;color:var(--silver-bright);font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .zg .gz{font-size:12px;color:var(--gold);opacity:.85;margin:3px 0 7px}
  .zg .stars{display:flex;flex-direction:column;gap:2px}
  .zg .st{font-size:13px;color:var(--silver-bright);line-height:1.35}
  .zg .st.minor{font-size:11.5px;color:#b8b0e0;opacity:.72}
  .badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;letter-spacing:1px;
    border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);color:var(--gold);margin-left:2px}
  .badge.body{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 55%,transparent)}
  .mut{font-size:10px;margin-left:4px;padding:0 5px;border-radius:6px;font-weight:700}
  .mut.禄{color:#0a0e2a;background:var(--gold)}
  .mut.权{color:#0a0e2a;background:var(--rose)}
  .mut.科{color:#0a0e2a;background:var(--cyan)}
  .mut.忌{color:#0a0e2a;background:#9a93b0}
  /* 四化 */
  .sx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sx{background:var(--panel);border:1px solid color-mix(in srgb,var(--purple) 26%,transparent);border-radius:12px;padding:14px 12px;text-align:center}
  .sx .t{font-size:15px;font-weight:700;width:34px;height:34px;line-height:34px;border-radius:50%;margin:0 auto 8px;color:#0a0e2a}
  .sx.禄 .t{background:var(--gold)} .sx.权 .t{background:var(--rose)} .sx.科 .t{background:var(--cyan)} .sx.忌 .t{background:#9a93b0}
  .sx .star{font-size:16px;color:var(--silver-bright);font-weight:600}
  .sx .to{font-size:12px;color:var(--gold);opacity:.85;margin-top:3px}
  /* 大限 */
  .dx-seq{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
  .dx{flex:0 0 auto;text-align:center;background:var(--panel);border:1px solid color-mix(in srgb,var(--purple) 26%,transparent);
    border-radius:9px;padding:9px 11px;min-width:80px}
  .dx.cur{border-color:var(--gold);box-shadow:0 0 14px rgba(255,214,110,.25)}
  .dx .gz{font-size:18px;color:var(--gold-bright);font-weight:600}
  .dx .age{font-size:11px;color:var(--silver-bright);opacity:.78;margin-top:3px}
  .dx .pn{font-size:10px;color:var(--purple);opacity:.8}
  .note{font-size:12px;opacity:.62;margin-top:8px;line-height:1.55}
  @media(max-width:680px){
    .zwheel{grid-template-columns:repeat(2,1fr)}
    .sx-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body data-page="ziwei">
<canvas id="stars" aria-hidden="true"></canvas>

<div class="wrap">
  <div class="page-head">
    <h1>紫微斗数</h1>
    <div class="en">ZI WEI DOU SHU · Purple Star Astrology · 深蓝紫银河</div>
    <div class="sub">十二宫 · 十四主星 · 四化禄权科忌 · 大限流转（iztro 离线算法引擎）</div>
  </div>

  <div class="card">
    <h3>出生信息</h3>
    <div class="row">
      <div class="col"><label>出生年</label><input id="zy" type="number" value="1990"></div>
      <div class="col"><label>月</label><input id="zm" type="number" value="5" min="1" max="12"></div>
      <div class="col"><label>日</label><input id="zd" type="number" value="20" min="1" max="31"></div>
    </div>
    <div class="row">
      <div class="col">
        <label>时辰</label>
        <select id="zh">
          <option value="0">子时（00–01）</option>
          <option value="1">丑时（01–03）</option>
          <option value="2">寅时（03–05）</option>
          <option value="3">卯时（05–07）</option>
          <option value="4">辰时（07–09）</option>
          <option value="5">巳时（09–11）</option>
          <option value="6">午时（11–13）</option>
          <option value="7">未时（13–15）</option>
          <option value="8">申时（15–17）</option>
          <option value="9">酉时（17–19）</option>
          <option value="10">戌时（19–21）</option>
          <option value="11">亥时（21–23）</option>
          <option value="12">晚子时（23–00）</option>
        </select>
      </div>
      <div class="col">
        <label>性别</label>
        <select id="zgender">
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
      </div>
      <div class="col"><label>当前年龄(可选)</label><input id="zage" type="number" value="36" min="0"></div>
    </div>
    <button class="btn" id="btn-ziwei">排 盘</button>
    <div class="err" id="err-ziwei"></div>
  </div>

  <div id="ziwei-result"></div>
</div>

<footer class="footer">
  <div class="disclaimer">⚠️ 以上为玄学体系的传统解读与象征推演，仅供参考。本页由 AI 生成，不构成医疗、法律、财务或投资建议；命理是参考，不是定数。涉及健康、法律、重大财务决策请咨询相应专业人士。</div>
</footer>

<script src="js-engine/vendor/node_modules/iztro/dist/iztro.min.js"></script>
<script>
(function(){
  "use strict";
  function $(s){return document.querySelector(s);}
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
  var BR_ORDER=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];

  // 星点背景
  (function(){
    var c=document.getElementById('stars'),x=c.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),W,H,ps=[];
    function sz(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);ps=[];var n=Math.min(140,Math.floor(W*H/9000));for(var i=0;i<n;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,a:Math.random()*.6+.25});}
    function dr(){x.clearRect(0,0,W,H);for(var i=0;i<ps.length;i++){var p=ps[i];x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle='rgba(168,144,255,'+p.a+')';x.fill();}}
    sz();dr();var t;addEventListener('resize',function(){clearTimeout(t);t=setTimeout(function(){sz();dr();},180);});
  })();

  $("#btn-ziwei").addEventListener("click",function(){
    var err=$("#err-ziwei");err.style.display="none";err.textContent="";
    try{
      var y=+$("#zy").value,m=+$("#zm").value,d=+$("#zd").value,hh=+$("#zh").value;
      if(!y||!m||!d) throw new Error("请填写完整的出生年月日");
      var solar=y+"-"+(m<10?"0":"")+m+"-"+(d<10?"0":"")+d;
      var a=iztro.astro.bySolar(solar, hh, $("#zgender").value, 'zh-CN');
      var age=$("#zage").value!==""?(+$("#zage").value):null;
      renderZiwei(a,age);
    }catch(e){ err.style.display="block"; err.textContent="⚠ "+e.message; }
  });

  function renderZiwei(a,age){
    var box=$("#ziwei-result"); box.innerHTML="";

    // 命宫 / 身宫
    var ming=null,body=null;
    a.palaces.forEach(function(p){ if(p.isOriginalPalace)ming=p; if(p.isBodyPalace)body=p; });
    var mz=ming?ming.heavenlyStem+ming.earthlyBranch:"";
    var mstars=ming?(ming.majorStars||[]).map(function(s){return s.name;}).join("、"):"";

    // 四化：扫所有主星 mutagen
    var acts={禄:[],权:[],科:[],忌:[]};
    a.palaces.forEach(function(p){
      (p.majorStars||[]).forEach(function(s){
        if(s.mutagen&&acts[s.mutagen]) acts[s.mutagen].push(s.name+"→"+p.name);
      });
    });

    // 1) 十二宫盘（按地支顺序排布）
    var cg=el("div","card"); cg.appendChild(el("h3",null,"十二宫盘 "+(ming?("命宫 "+ming.name+" "+mz+"　主星："+mstars):"")));
    var grid=el("div","zwheel");
    var sorted=a.palaces.slice().sort(function(x,y){return BR_ORDER.indexOf(x.earthlyBranch)-BR_ORDER.indexOf(y.earthlyBranch);});
    sorted.forEach(function(p){
      var zg=el("div","zg"+(p.isOriginalPalace?" ming":"")+(p.isBodyPalace?" body":""));
      var nm=el("div","gname",p.name);
      if(p.isOriginalPalace)nm.appendChild(el("span","badge","命"));
      if(p.isBodyPalace)nm.appendChild(el("span","badge body","身"));
      zg.appendChild(nm);
      zg.appendChild(el("div","gz",p.heavenlyStem+p.earthlyBranch));
      var st=el("div","stars");
      (p.majorStars||[]).forEach(function(s){
        var line=el("div","st",s.name);
        if(s.mutagen&&["禄","权","科","忌"].indexOf(s.mutagen)>=0)line.appendChild(el("span","mut "+s.mutagen,s.mutagen));
        st.appendChild(line);
      });
      (p.minorStars||[]).slice(0,6).forEach(function(s){ st.appendChild(el("div","st minor",(s.name||s))); });
      zg.appendChild(st);
      grid.appendChild(zg);
    });
    cg.appendChild(grid);
    box.appendChild(cg);

    // 2) 四化
    var cs=el("div","card"); cs.appendChild(el("h3",null,"四化 · 禄权科忌"));
    var sg=el("div","sx-grid");
    ["禄","权","科","忌"].forEach(function(t){
      var sx=el("div","sx "+t);
      sx.appendChild(el("div","t",t));
      var list=acts[t].length?acts[t].join("<br>"):"—";
      sx.appendChild(el("div","star",(acts[t][0]?acts[t][0].split("→")[0]:"—")));
      sx.appendChild(el("div","to",acts[t].length?(acts[t][0].split("→")[1]+"宫"):"—"));
      sg.appendChild(sx);
    });
    cs.appendChild(sg);
    cs.appendChild(el("div","note","四化依命宫天干推导：禄主进益、权主掌控、科主声名、忌主纠缠。上表列出落陷星曜与其所在宫位。"));
    box.appendChild(cs);

    // 3) 大限
    var cd=el("div","card"); cd.appendChild(el("h3",null,"大限流转"+(age!=null?" · 当前 "+age+" 岁":"")));
    var seq=el("div","dx-seq");
    a.palaces.forEach(function(p){
      var ages=p.ages||[];
      var cur=false,win="";
      for(var i=0;i<ages.length;i++){
        var s=ages[i]; if(age!=null&&s<=age&&age<s+10){cur=true;win=s+"–"+(s+9);break;}
        if(i===0)win=s+"–"+(s+9);
      }
      var dx=el("div","dx"+(cur?" cur":""));
      dx.appendChild(el("div","gz",p.heavenlyStem+p.earthlyBranch));
      dx.appendChild(el("div","age",win+(cur?" 岁":"")));
      dx.appendChild(el("div","pn",p.name+"宫"));
      seq.appendChild(dx);
    });
    cd.appendChild(seq);
    cd.appendChild(el("div","note","大限依命宫天干阴阳、男女顺逆排布，每限十年。高亮为当前年龄所处大限（依 iztro 大限岁序推算，供参考）。"));
    box.appendChild(cd);
    box.scrollIntoView({behavior:"smooth",block:"start"});
  }
})();
</script>
</body>
</html>
