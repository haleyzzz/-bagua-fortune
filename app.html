<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>命理工具 · 八字排盘与黄历</title>
<style>
  :root{
    --bg:#0e0b08;
    --bg-soft:#15110a;
    --gold:#d4af6e;
    --gold-bright:#f3d99c;
    --ink:#ece4d3;
    --ink-dim:#a99a7e;
    --red:#c44a3c;
    --green:#6b9a5c;
    --line:rgba(212,175,110,.22);
    --card:rgba(212,175,110,.05);
    --font:"PingFang SC","Hiragino Sans GB","STSong","Songti SC",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:
      radial-gradient(circle at 50% 0%, #1a140c 0%, var(--bg) 60%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body{padding:0 0 48px;}
  a{color:var(--gold-bright);text-decoration:none;}

  /* 顶部 */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,rgba(14,11,8,.96),rgba(14,11,8,.8));
    backdrop-filter:blur(6px);
  }
  .topbar .brand{font-size:18px;letter-spacing:.12em;color:var(--gold-bright);font-weight:700;}
  .topbar .brand small{display:block;font-size:10px;letter-spacing:.3em;color:var(--ink-dim);font-weight:300;margin-top:2px;}
  .topbar .home{font-size:12px;color:var(--ink-dim);border:1px solid var(--line);padding:6px 12px;border-radius:18px;}

  /* Tab */
  .tabs{display:flex;gap:0;max-width:760px;margin:22px auto 0;padding:0 16px;}
  .tab{
    flex:1;text-align:center;padding:12px 0;cursor:pointer;
    color:var(--ink-dim);letter-spacing:.18em;font-size:14px;
    border-bottom:2px solid transparent;transition:all .25s;
  }
  .tab.active{color:var(--gold-bright);border-bottom-color:var(--gold);text-shadow:0 0 12px rgba(212,175,110,.4);}

  .panel{max-width:760px;margin:0 auto;padding:18px 16px;display:none;}
  .panel.active{display:block;}

  /* 表单 */
  .form-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:12px;margin-bottom:14px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11px;letter-spacing:.1em;color:var(--ink-dim);}
  .field input,.field select{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--ink);
    padding:9px 10px;border-radius:8px;font-family:var(--font);font-size:14px;
    outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,110,.15);}
  .field.full{grid-column:1/-1;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-dim);}
  .btn{
    background:linear-gradient(180deg,var(--gold),#b8924f);color:#1a130a;
    border:none;padding:11px 26px;border-radius:8px;font-size:14px;font-weight:700;
    letter-spacing:.1em;cursor:pointer;font-family:var(--font);transition:filter .2s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn[disabled]{opacity:.5;cursor:wait;}

  /* 结果卡片 */
  .err{
    border:1px solid var(--red);background:rgba(196,74,60,.1);color:#f0b8b0;
    padding:12px 14px;border-radius:8px;font-size:13px;margin:10px 0;line-height:1.6;
  }
  .hint{font-size:12px;color:var(--ink-dim);line-height:1.7;margin:6px 0 14px;}

  .card{
    border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:16px;margin:14px 0;
  }
  .card h3{
    font-size:13px;letter-spacing:.2em;color:var(--gold);font-weight:600;
    margin-bottom:12px;display:flex;align-items:center;gap:8px;
  }
  .card h3::before{content:"";width:4px;height:14px;background:var(--gold);border-radius:2px;display:inline-block;}

  /* 四柱表 */
  .pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .zhubox{border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;background:rgba(0,0,0,.25);}
  .zhubox .tag-row{font-size:11px;color:var(--ink-dim);letter-spacing:.08em;margin-bottom:8px;}
  .zhubox .gz{display:flex;flex-direction:column;gap:8px;align-items:center;}
  .zhubox .gan,.zhubox .zhi{
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;border:1px solid var(--line);
  }
  .el-jin{background:rgba(212,175,110,.16);border-color:var(--gold)!important;color:var(--gold-bright);}
  .el-mu{background:rgba(107,154,92,.16);border-color:var(--green)!important;color:#a6d39a;}
  .el-shui{background:rgba(90,140,170,.18);border-color:#6a9ec0!important;color:#a9cfe6;}
  .el-huo{background:rgba(196,74,60,.16);border-color:var(--red)!important;color:#e89a8e;}
  .el-tu{background:rgba(160,140,100,.18);border-color:#b8a878!important;color:#dcceb0;}

  /* 五行统计 */
  .wuxing{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .wx-item{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:16px;border:1px solid var(--line);}
  .wx-bar{height:5px;border-radius:3px;background:var(--gold);}

  /* 大运序列 */
  .dayun-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .dy{
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center;min-width:62px;background:rgba(0,0,0,.2);
  }
  .dy .gz{font-size:17px;font-weight:700;color:var(--gold-bright);}
  .dy .age{font-size:10px;color:var(--ink-dim);margin-top:3px;letter-spacing:.05em;}

  /* 流年十神 */
  .shen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px;}
  .shen{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:rgba(0,0,0,.2);}
  .shen b{color:var(--gold-bright);font-size:15px;}
  .shen .sg{color:var(--ink-dim);font-size:12px;}

  /* 月历 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-head .ym{font-size:18px;letter-spacing:.1em;color:var(--gold-bright);}
  .cal-nav{display:flex;gap:8px;}
  .cal-nav button{
    width:38px;height:34px;border:1px solid var(--line);background:var(--bg-soft);color:var(--ink);
    border-radius:8px;cursor:pointer;font-size:16px;font-family:var(--font);
  }
  .cal-nav button:hover{border-color:var(--gold);color:var(--gold-bright);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--ink-dim);padding:4px 0;letter-spacing:.05em;}
  .day{
    border:1px solid var(--line);border-radius:8px;min-height:58px;padding:6px 4px;cursor:pointer;
    background:rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;transition:all .18s;position:relative;
  }
  .day:hover{border-color:var(--gold);background:rgba(212,175,110,.08);}
  .day .d-num{font-size:14px;color:var(--ink);}
  .day .d-lun{font-size:10px;color:var(--ink-dim);line-height:1.2;}
  .day .d-jc{font-size:9px;color:var(--gold);}
  .day.term .d-num{color:var(--red);font-weight:700;}
  .day.today{outline:2px solid var(--gold);outline-offset:-2px;}
  .day .badge-ji{position:absolute;right:4px;top:4px;font-size:9px;color:#e89a8e;}

  /* 黄历详情 */
  .detail h2{font-size:18px;color:var(--gold-bright);letter-spacing:.06em;margin-bottom:4px;}
  .detail .sub{font-size:12px;color:var(--ink-dim);margin-bottom:12px;}
  .detail .kv{display:grid;grid-template-columns:80px 1fr;gap:6px 10px;font-size:13px;line-height:1.7;}
  .detail .kv .k{color:var(--ink-dim);}
  .detail .yiji{margin-top:10px;}
  .detail .yiji .y,.detail .yiji .j{display:inline-block;padding:3px 9px;border-radius:14px;font-size:12px;margin:3px 4px 0 0;}
  .detail .yiji .y{background:rgba(107,154,92,.14);border:1px solid var(--green);color:#a6d39a;}
  .detail .yiji .j{background:rgba(196,74,60,.12);border:1px solid var(--red);color:#e89a8e;}

  .loading{text-align:center;color:var(--ink-dim);font-size:13px;padding:20px;letter-spacing:.1em;}

  @media (max-width:560px){
    .pillars{grid-template-columns:repeat(2,1fr);}
    .day{min-height:48px;}
    .topbar .brand{font-size:15px;}
    .panel{padding:14px 12px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">命理工具<small>BAZI &amp; ALMANAC</small></div>
  <a class="home" href="/index.html">← 返回落地页</a>
</div>

<div class="tabs">
  <div class="tab active" data-tab="bazi">八字排盘</div>
  <div class="tab" data-tab="almanac">黄历查询</div>
</div>

<!-- ════════ 八字排盘 ════════ -->
<section class="panel active" id="panel-bazi">
  <div class="hint">输入出生信息排定四柱八字、大运与流年十神。公历/农历皆可，真太阳时按经度校准。结果仅供参考，命理非定数。</div>
  <div class="form-grid">
    <div class="field">
      <label>历法</label>
      <select id="cal-type">
        <option value="solar">公历</option>
        <option value="lunar">农历</option>
      </select>
    </div>
    <div class="field" id="leap-wrap" style="display:none;">
      <label>闰月</label>
      <select id="is-leap"><option value="0">否</option><option value="1">是</option></select>
    </div>
    <div class="field"><label>年</label><input id="by" type="number" value="1990" min="1900" max="2100"></div>
    <div class="field"><label>月</label><input id="bm" type="number" value="5" min="1" max="12"></div>
    <div class="field"><label>日</label><input id="bd" type="number" value="20" min="1" max="31"></div>
    <div class="field"><label>时(0-23)</label><input id="bh" type="number" value="10" min="0" max="23"></div>
    <div class="field"><label>分</label><input id="bmi" type="number" value="0" min="0" max="59"></div>
    <div class="field">
      <label>性别</label>
      <select id="bg"><option value="male">男</option><option value="female">女</option></select>
    </div>
    <div class="field"><label>经度(可选)</label><input id="blon" type="number" value="120" step="0.1" min="-180" max="180"></div>
    <div class="field"><label>流年(可选)</label><input id="fy" type="number" value="2026" min="1900" max="2100"></div>
    <div class="field"><label>当前年龄(可选)</label><input id="age" type="number" value="" min="0" max="120" placeholder="如36"></div>
  </div>
  <div class="row">
    <button class="btn" id="submit-bazi">开始排盘</button>
    <span class="hint" style="margin:0;">留空项将不纳入计算</span>
  </div>
  <div id="bazi-result"></div>
</section>

<!-- ════════ 黄历查询 ════════ -->
<section class="panel" id="panel-almanac">
  <div class="hint">浏览公历月历，点击任意日期查看当日干支、建除十二神、宜忌与胎神方位。</div>
  <div class="cal-head">
    <div class="ym" id="cal-ym">—</div>
    <div class="cal-nav">
      <button id="prev-m">‹</button>
      <button id="today-m">今</button>
      <button id="next-m">›</button>
    </div>
  </div>
  <div class="cal-grid" id="cal-dow">
    <div class="cal-dow">日</div><div class="cal-dow">一</div><div class="cal-dow">二</div>
    <div class="cal-dow">三</div><div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div>
  </div>
  <div class="cal-grid" id="cal-body" style="margin-top:6px;"></div>
  <div id="almanac-detail"></div>
</section>

<script>
/* ── Tab 切换 ── */
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    var name=t.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x===t);});
    document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('active',p.id==='panel-'+name);});
    if(name==='almanac') renderMonth(curY,curM);
  });
});

/* 农历时显示闰月选择 */
document.getElementById('cal-type').addEventListener('change',function(){
  document.getElementById('leap-wrap').style.display = this.value==='lunar' ? 'flex':'none';
});

/* 干支五行映射（仅用于前端着色，非推算） */
var GAN_EL={甲:'mu',乙:'mu',丙:'huo',丁:'huo',戊:'tu',己:'tu',庚:'jin',辛:'jin',壬:'shui',癸:'shui'};
var ZHI_EL={子:'shui',丑:'tu',寅:'mu',卯:'mu',辰:'tu',巳:'huo',午:'huo',未:'tu',申:'jin',酉:'jin',戌:'tu',亥:'shui'};
function elClass(c){return 'el-'+((GAN_EL[c]||ZHI_EL[c])||'tu');}
function gzCells(gz){
  var g=gz.charAt(0),z=gz.charAt(1);
  return '<div class="gan '+elClass(g)+'">'+g+'</div><div class="zhi '+elClass(z)+'">'+z+'</div>';
}
function showErr(box,msg){box.innerHTML='<div class="err">⚠️ '+msg+'</div>';}
function clearBox(box){box.innerHTML='';}

/* ── 八字排盘 ── */
document.getElementById('submit-bazi').addEventListener('click',function(){
  var btn=this; var box=document.getElementById('bazi-result');
  clearBox(box);
  var payload={
    calendar_type:document.getElementById('cal-type').value,
    year:+document.getElementById('by').value,
    month:+document.getElementById('bm').value,
    day:+document.getElementById('bd').value,
    hour:+document.getElementById('bh').value,
    minute:+document.getElementById('bmi').value,
    gender:document.getElementById('bg').value,
    longitude:+document.getElementById('blon').value||120
  };
  if(payload.calendar_type==='lunar') payload.is_leap=(document.getElementById('is-leap').value==='1');
  var fy=document.getElementById('fy').value; if(fy) payload.flow_year=+fy;
  var age=document.getElementById('age').value; if(age) payload.age=+age;

  if(!payload.year||!payload.month||!payload.day){showErr(box,'请填写完整的出生年月日。');return;}
  btn.disabled=true; btn.textContent='排盘中…';
  box.innerHTML='<div class="loading">正在推算四柱与大运…</div>';

  fetch('/api/bazi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
    .then(function(o){
      btn.disabled=false; btn.textContent='开始排盘';
      if(!o.ok){showErr(box,'排盘失败：'+(o.d.error||'未知错误'));return;}
      renderBazi(o.d,box);
    })
    .catch(function(e){btn.disabled=false;btn.textContent='开始排盘';showErr(box,'网络或服务器错误：'+e.message+'。请确认本地服务已启动（python serve.py）。');});
});

function renderBazi(d,box){
  var P=d.pillars&&d.pillars.pillars; if(!P){showErr(box,'返回数据缺少四柱字段。');return;}
  var order=[['year','年柱'],['month','月柱'],['day','日柱'],['hour','时柱']];
  var html='<div class="card"><h3>四柱八字</h3><div class="pillars">';
  order.forEach(function(o){
    var p=P[o[0]]||{}; var gz=p.gz||'';
    html+='<div class="zhubox"><div class="tag-row">'+o[1]+'</div><div class="gz">'+(gz?gzCells(gz):'—')+'</div></div>';
  });
  html+='</div>';
  // 五行统计
  var wuxing={'金':0,'木':0,'水':0,'火':0,'土':0};
  Object.keys(P).forEach(function(k){var gz=(P[k].gz||''); for(var i=0;i<gz.length;i++){var c=gz.charAt(i);var e=GAN_EL[c]||ZHI_EL[c];if(e)wuxing[{jin:'金',mu:'木',shui:'水',huo:'火',tu:'土'}[e]]++;}});
  html+='<div style="margin-top:12px;" class="wuxing">';
  Object.keys(wuxing).forEach(function(k){if(wuxing[k])html+='<span class="wx-item el-'+{金:'jin',木:'mu',水:'shui',火:'huo',土:'tu'}[k]+'">'+k+' '+wuxing[k]+'</span>';});
  html+='</div></div>';

  // 大运
  var du=d.dayun||{};
  if(du.sequence){
    html+='<div class="card"><h3>大运（'+(du.direction===1?'顺排':'逆排')+' · 约 '+ (du.start_age_display||'—') +' 起运）</h3><div class="dayun-list">';
    du.sequence.slice(0,8).forEach(function(s,i){
      var age=(du.start_age||0)+i*10;
      html+='<div class="dy"><div class="gz">'+ (s.gz||'') +'</div><div class="age">'+(age)+'–'+(age+9)+'岁</div></div>';
    });
    html+='</div></div>';
  }

  // 流年十神
  var ly=d.liunian||{};
  if(ly.flow_gz){
    html+='<div class="card"><h3>'+ (payload_flow_year_label(ly)) +' 流年十神（以日主为参照）</h3><div class="shen-grid">';
    html+='<div class="shen"><span class="sg">流年</span><b>'+ly.flow_gz+'</b><span class="sg">'+(ly.flow_shen&&ly.flow_shen['十神']||'')+'</span></div>';
    ['year_shen','month_shen','self_shen','hour_shen'].forEach(function(k){
      var o=ly[k]||{}; var label={year_shen:'年柱',month_shen:'月柱',self_shen:'日主',hour_shen:'时柱'}[k];
      html+='<div class="shen"><span class="sg">'+label+'</span><b>'+(o.gz||o.stem_char||'')+'</b><span class="sg">'+(o['十神']||'')+'</span></div>';
    });
    if(ly.dayun_gz) html+='<div class="shen"><span class="sg">当前大运</span><b>'+ly.dayun_gz+'</b><span class="sg">'+(ly.dayun_shen&&ly.dayun_shen['十神']||'')+'</span></div>';
    html+='</div></div>';
  }

  box.innerHTML=html;
}
function payload_flow_year_label(ly){return (ly.flow_year||'当年')+' 年';}

/* ── 黄历月历 ── */
var now=new Date(); var curY=now.getFullYear(), curM=now.getMonth()+1;
var todayStr=now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();

function renderMonth(y,m){
  curY=y; curM=m;
  document.getElementById('cal-ym').textContent=y+'年'+m+'月';
  var body=document.getElementById('cal-body');
  body.innerHTML='<div class="loading" style="grid-column:1/-1;">加载本月黄历…</div>';
  fetch('/api/month?year='+y+'&month='+m).then(function(r){return r.json();})
    .then(function(list){
      if(!Array.isArray(list)){body.innerHTML='';showErr(document.getElementById('almanac-detail'),'月份数据加载失败。');return;}
      var first=new Date(y,m-1,1).getDay();
      var html='';
      for(var i=0;i<first;i++) html+='<div></div>';
      list.forEach(function(d){
        var cls='day'; if(d.term) cls+=' term'; if((y+'-'+m+'-'+d.day)===todayStr) cls+=' today';
        var jc=d.jianchu?('<div class="d-jc">'+d.jianchu+'</div>'):'';
        var lun=d.lunar?('<div class="d-lun">'+shortLunar(d.lunar)+'</div>'):'';
        html+='<div class="'+cls+'" data-day="'+d.day+'"><div class="d-num">'+d.day+'</div>'+lun+jc+'</div>';
      });
      body.innerHTML=html;
      body.querySelectorAll('.day').forEach(function(el){
        el.addEventListener('click',function(){
          var day=+el.getAttribute('data-day');
          loadAlmanac(y,m,day);
        });
      });
    })
    .catch(function(e){body.innerHTML='';showErr(document.getElementById('almanac-detail'),'加载失败：'+e.message+'。请确认本地服务已启动。');});
}
function shortLunar(s){return s.replace(/^\d+年/,'').replace(/月/,'·').replace(/日/,'');}

function loadAlmanac(y,m,d){
  var box=document.getElementById('almanac-detail');
  box.innerHTML='<div class="loading">查询当日黄历…</div>';
  fetch('/api/almanac?date='+y+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d).then(function(r){return r.json();})
    .then(function(a){
      var gz=a.ganzhi||{}; var jc=a.jianchu||{}; var yi=(a.yiji&&a.yiji['宜'])||[]; var ji=(a.yiji&&a.yiji['忌'])||[]; var ts=a.taishen||{};
      var yiHtml=yi.map(function(x){return '<span class="y">'+x+'</span>';}).join('')||'—';
      var jiHtml=ji.map(function(x){return '<span class="j">'+x+'</span>';}).join('')||'—';
      box.innerHTML='<div class="card detail"><h2>'+y+'年'+m+'月'+d+'日</h2>'+
        '<div class="sub">'+(a.lunar_display||'')+' · '+(a.term?('『'+a.term+'』'):'')+' 星期'+'日一二三四五六'.charAt(new Date(y,m-1,d).getDay())+'</div>'+
        '<div class="kv">'+
          '<div class="k">干支</div><div class="v">'+(gz.year||'')+' '+(gz.month||'')+' '+(gz.day||'')+'</div>'+
          '<div class="k">生肖</div><div class="v">'+(a.animal||'—')+'</div>'+
          '<div class="k">建除</div><div class="v">'+(jc.name||'—')+'</div>'+
          '<div class="k">胎神</div><div class="v">'+(ts['方位']||'—')+'</div>'+
        '</div>'+
        '<div class="yiji"><div class="k" style="color:var(--ink-dim);font-size:12px;margin:10px 0 4px;">宜</div>'+yiHtml+'<div class="k" style="color:var(--ink-dim);font-size:12px;margin:12px 0 4px;">忌</div>'+jiHtml+'</div>'+
        '</div>';
    })
    .catch(function(e){showErr(box,'查询失败：'+e.message);});
}

document.getElementById('prev-m').addEventListener('click',function(){var p=new Date(curY,curM-2,1);renderMonth(p.getFullYear(),p.getMonth()+1);});
document.getElementById('next-m').addEventListener('click',function(){var p=new Date(curY,curM,1);renderMonth(p.getFullYear(),p.getMonth()+1);});
document.getElementById('today-m').addEventListener('click',function(){var n=new Date();renderMonth(n.getFullYear(),n.getMonth()+1);});

/* 初始：默认渲染当月黄历 */
renderMonth(curY,curM);

/* 支持 #bazi / #almanac 锚点直达对应 Tab */
(function(){
  var h=location.hash.replace('#','');
  if(h==='bazi'||h==='almanac'){
    var t=document.querySelector('.tab[data-tab="'+h+'"]');
    if(t)t.click();
  }
})();
</script>
