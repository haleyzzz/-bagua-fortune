<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>塔罗占卜 · 深紫鎏金</title>
<link rel="stylesheet" href="css/common.css">
<style>
  :root{
    --bg:#1a1133; --gold:#d4af37; --purple-deep:#4a2a6a;
    --ink:#e8dcc0; --red:#c44a3c;
    --accent:#d4af37; --gold-bright:#f0d880; --panel:rgba(74,42,106,.3);
  }
  .err{color:var(--red);background:rgba(196,74,60,.12);border:1px solid rgba(196,74,60,.42);
    border-radius:8px;padding:12px;font-size:14px;margin-top:14px;display:none}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>.col{flex:1;min-width:150px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--gold);letter-spacing:1px;cursor:pointer}
  .chk input{width:auto;margin:0}
  /* 牌阵 */
  .spread-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}
  .tcard{perspective:1000px;background:transparent;border:none;padding:0;position:relative}
  .tcard-inner{position:relative;width:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform:rotateY(180deg)}
  .tcard-inner.flipped{transform:rotateY(0deg)}
  .tcard-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:14px 13px;display:flex;flex-direction:column;gap:8px}
  .tcard-face.front{position:relative;background:linear-gradient(180deg,rgba(74,42,106,.42),rgba(26,17,51,.6));border:1px solid color-mix(in srgb,var(--gold) 34%,transparent)}
  .tcard-face.back{position:absolute;inset:0;transform:rotateY(180deg);align-items:center;justify-content:center;background:linear-gradient(180deg,#3a2360,#1a1133);border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);color:var(--gold);font-size:15px;letter-spacing:4px}
  .tcard:hover .tcard-face.front{box-shadow:0 0 18px rgba(212,175,55,.22)}
  .tcard.rev .tcard-face.front{border-color:color-mix(in srgb,var(--red) 42%,transparent)}
  .tpos{font-size:12.5px;color:var(--gold-bright);letter-spacing:1px;font-weight:600;border-bottom:1px solid color-mix(in srgb,var(--gold) 22%,transparent);padding-bottom:7px}
  .tpos .pdesc{display:block;font-size:10.5px;color:var(--ink);opacity:.6;font-weight:400;letter-spacing:0;margin-top:2px}
  .tface{text-align:center;padding:8px 0}
  .tname{font-size:21px;color:var(--ink);font-weight:700;letter-spacing:2px}
  .ten{font-size:11px;color:var(--gold);opacity:.78;letter-spacing:1px;margin-top:3px;font-style:italic}
  .torient{display:inline-block;margin-top:7px;font-size:11px;padding:1px 12px;border-radius:14px;letter-spacing:2px}
  .torient.up{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold-bright);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
  .torient.dn{background:rgba(196,74,60,.18);color:#f0a890;border:1px solid rgba(196,74,60,.5)}
  .ttype{position:absolute;top:10px;right:12px;font-size:9.5px;color:var(--gold);opacity:.6;letter-spacing:1px}
  .tmean{font-size:12.5px;color:var(--ink);opacity:.9;line-height:1.6;border-top:1px solid color-mix(in srgb,var(--gold) 18%,transparent);padding-top:9px}
  .note{font-size:12px;opacity:.6;margin-top:10px;line-height:1.55}

  /* 牌义辞典 */
  .dict-filters{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
  .dict-filters button{font-family:inherit;font-size:13px;letter-spacing:1px;color:var(--gold);background:transparent;
    border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);border-radius:16px;padding:5px 15px;cursor:pointer;transition:.18s}
  .dict-filters button:hover{background:color-mix(in srgb,var(--gold) 14%,transparent)}
  .dict-filters button.on{background:var(--gold);color:#1a1133;border-color:var(--gold);font-weight:700}
  .dict-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
  .dict-tile{background:linear-gradient(180deg,rgba(74,42,106,.4),rgba(26,17,51,.55));
    border:1px solid color-mix(in srgb,var(--gold) 26%,transparent);border-radius:11px;padding:11px 9px;cursor:pointer;
    text-align:center;transition:.18s;display:flex;flex-direction:column;gap:3px;align-items:center}
  .dict-tile:hover{box-shadow:0 0 14px rgba(212,175,55,.22);transform:translateY(-2px)}
  .dict-tile.sel{outline:2px solid var(--gold);outline-offset:1px}
  .dict-tile .dt-en{font-size:9.5px;color:var(--gold);opacity:.66;letter-spacing:.5px;font-style:italic;line-height:1.25}
  .dict-tile .dt-cn{font-size:15px;color:var(--ink);font-weight:700;letter-spacing:1px}
  .dict-tile .dt-tag{font-size:9px;color:var(--gold-bright);opacity:.7;letter-spacing:1px}
  .dict-detail{margin-top:16px;border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:12px;
    background:linear-gradient(180deg,rgba(74,42,106,.26),rgba(26,17,51,.4));padding:16px;display:none}
  .dict-detail.show{display:block}
  .dd-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid color-mix(in srgb,var(--gold) 20%,transparent);padding-bottom:9px}
  .dd-cn{font-size:21px;font-weight:700;color:var(--ink);letter-spacing:2px}
  .dd-en{font-size:12px;color:var(--gold);opacity:.8;font-style:italic}
  .dd-tag{font-size:11px;color:var(--gold-bright);opacity:.8;margin-left:auto}
  .dd-tabs{display:flex;gap:8px;margin:13px 0 6px}
  .dd-tabs button{font-family:inherit;font-size:13px;letter-spacing:1px;padding:5px 16px;border-radius:14px;cursor:pointer;
    background:transparent;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 34%,transparent)}
  .dd-tabs button.on{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold-bright);font-weight:700;border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
  .dd-tabs button.dn.on{background:rgba(196,74,60,.18);color:#f0a890;border-color:rgba(196,74,60,.5)}
  .dd-text{font-size:14px;color:var(--ink);opacity:.92;line-height:1.75;margin-top:8px;min-height:42px}
  .dd-kw{margin-top:12px;font-size:12px;color:var(--gold);opacity:.82;letter-spacing:.5px}
  .dd-kw b{color:var(--gold-bright);font-weight:600}

  @media(max-width:680px){
    .spread-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
    .dict-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  }
</style>
</head>

<div class="wrap">
  <div class="page-head">
    <h1>塔罗占卜</h1>
    <div class="en">TAROT · Rider-Waite-Smith · 深紫鎏金</div>
    <div class="sub">RWS 78 张全套 · 三牌 / 凯尔特十字 / 感情 / 每日一牌</div>
  </div>

  <div class="card">
    <h3>选牌阵 <span class="badge">静心片刻再抽</span></h3>
    <div class="row">
      <div class="col">
        <label>牌阵</label>
        <select id="spread">
          <option value="three">三牌阵 · 过去 / 现在 / 未来</option>
          <option value="celtic">凯尔特十字 · 十张</option>
          <option value="love">感情牌阵 · 六张</option>
          <option value="daily">每日一牌</option>
        </select>
      </div>
    </div>
    <label class="chk"><input type="checkbox" id="rev" checked> 允许逆位（正逆位解读）</label>
    <button class="btn" id="btn-draw">🜍 抽 牌</button>
    <div class="err" id="err-tarot"></div>
  </div>

  <div id="tarot-result"></div>

  <div class="card" style="margin-top:18px">
    <h3>牌义辞典 <span class="badge">78 张全解 · 点牌看正逆位</span></h3>
    <div class="dict-filters" id="dict-filters">
      <button data-f="all" class="on">全部</button>
      <button data-f="major">大阿尔卡那</button>
      <button data-f="Wands">权杖</button>
      <button data-f="Cups">圣杯</button>
      <button data-f="Swords">宝剑</button>
      <button data-f="Pentacles">星币</button>
    </div>
    <div class="dict-grid" id="dict-grid"></div>
    <div class="dict-detail" id="dict-detail"></div>
  </div>
</div>

<script src="js-engine/src/tarot.js"></script>
<script>
(function(){
  "use strict";
  function $(s){return document.querySelector(s);}
  function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

  $("#btn-draw").addEventListener("click",function(){
    var err=$("#err-tarot"); err.style.display="none"; err.textContent="";
    try{
      var key=$("#spread").value;
      var sp=TAROT.SPREADS[key];
      if(!sp) throw new Error("未知牌阵");
      var allowRev=$("#rev").checked;
      var drawn=TAROT.draw(sp.pos.length, allowRev);
      render(sp, drawn);
    }catch(e){ err.style.display="block"; err.textContent="⚠ "+e.message; }
  });

  function render(sp, drawn){
    var box=$("#tarot-result"); box.innerHTML="";
    var c=el("div","card");
    c.appendChild(el("h3",null,sp.name+" <span class='badge'>"+drawn.length+" 张</span>"));
    var grid=el("div","spread-grid");
    sp.pos.forEach(function(p,i){
      var d=drawn[i];
      if(!d){ return; }
      var card=d.card;
      var tc=el("div","tcard"+(d.reversed?" rev":""));
      var inner=el("div","tcard-inner");
      inner.appendChild(el("div","tcard-face back","✶ 塔 罗 ✶"));
      var front=el("div","tcard-face front");
      front.appendChild(el("div","ttype",card.type==="major"?"大阿尔卡那":"小阿尔卡那"));
      var posd=el("div","tpos",p.label);
      posd.appendChild(el("span","pdesc",p.desc));
      front.appendChild(posd);
      var face=el("div","tface");
      face.appendChild(el("div","tname",card.cn||"牌"));
      face.appendChild(el("div","ten",card.en||""));
      face.appendChild(el("div","torient "+(d.reversed?"dn":"up"),d.reversed?"↻ 逆位":"正位"));
      front.appendChild(face);
      front.appendChild(el("div","tmean",d.meaning||""));
      inner.appendChild(front);
      tc.appendChild(inner);
      grid.appendChild(tc);
      setTimeout(function(){ inner.classList.add("flipped"); }, 140 + i*160);
    });
    c.appendChild(grid);
    c.appendChild(el("div","note","塔罗以意象与直觉为引，以上为牌义参考。同一组牌在不同心境下会浮现不同讯息，请以自己的感受为最终判准。"));
    box.appendChild(c);
    box.scrollIntoView({behavior:"smooth",block:"start"});
  }

  /* ---------- 牌义辞典 ---------- */
  var dictState = { filter: "all", sel: -1, rev: false };
  var dictGrid = $("#dict-grid");
  var dictDetail = $("#dict-detail");

  function dictList() {
    if (dictState.filter === "all") return TAROT.DECK;
    if (dictState.filter === "major") return TAROT.DECK.filter(function (c) { return c.type === "major"; });
    return TAROT.DECK.filter(function (c) { return c.suitEn === dictState.filter; });
  }
  function tagOf(c) { return c.type === "major" ? "大阿尔卡那" : (c.suitCn + "·" + c.elem); }

  function renderDict() {
    dictGrid.innerHTML = "";
    dictList().forEach(function (c) {
      var idx = TAROT.DECK.indexOf(c);
      var t = el("div", "dict-tile" + (dictState.sel === idx ? " sel" : ""));
      t.appendChild(el("div", "dt-tag", tagOf(c)));
      t.appendChild(el("div", "dt-cn", c.cn));
      t.appendChild(el("div", "dt-en", c.en));
      t.addEventListener("click", function () { selectCard(idx); });
      dictGrid.appendChild(t);
    });
  }
  function selectCard(idx) {
    dictState.sel = idx;
    dictState.rev = false;
    renderDict();
    renderDetail();
  }
  function renderDetail() {
    var c = TAROT.DECK[dictState.sel];
    if (!c) { dictDetail.className = "dict-detail"; return; }
    dictDetail.className = "dict-detail show";
    dictDetail.innerHTML = "";
    var head = el("div", "dd-head");
    head.appendChild(el("span", "dd-cn", c.cn));
    head.appendChild(el("span", "dd-en", c.en));
    head.appendChild(el("span", "dd-tag", tagOf(c)));
    dictDetail.appendChild(head);

    var tabs = el("div", "dd-tabs");
    var up = el("button", "up" + (dictState.rev ? "" : " on"), "正位");
    var dn = el("button", "dn" + (dictState.rev ? " on" : ""), "逆位");
    up.addEventListener("click", function () { dictState.rev = false; renderDetail(); });
    dn.addEventListener("click", function () { dictState.rev = true; renderDetail(); });
    tabs.appendChild(up); tabs.appendChild(dn);
    dictDetail.appendChild(tabs);

    dictDetail.appendChild(el("div", "dd-text", dictState.rev ? c.reversed : c.upright));
    var kw = el("div", "dd-kw");
    kw.innerHTML = "<b>关键词 · " + (dictState.rev ? "逆位" : "正位") + "：</b>" + (dictState.rev ? c.kwRev : c.kwUp);
    dictDetail.appendChild(kw);
  }

  $("#dict-filters").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    [].forEach.call(this.children, function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    dictState.filter = b.getAttribute("data-f");
    dictState.sel = -1;
    dictDetail.className = "dict-detail";
    renderDict();
  });

  // 初始渲染辞典
  renderDict();
})();
</script>
</body>
